[test]
# Exclude Playwright E2E specs — they require `bun x playwright test`, not bun runner.
# E2E specs live in e2e/ at root; unit tests are in tests/*.test.ts
pathIgnorePatterns = ["e2e/**", "tests/e2e/**"]
# Preload runs before any test file is imported — sets REDIS_DB=1 to isolate tests from production DB 0
preload = ["./tests/setup.ts"]
