name: Sync public Wiki

on:
  push:
    branches: [main]
    paths:
      - "docs/wiki/**"
      - "scripts/sync-github-wiki.ts"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Validate Wiki source
        run: bun run scripts/sync-github-wiki.ts --check

      - name: Sync GitHub Wiki
        env:
          KONOHA_WIKI_TOKEN: ${{ secrets.KONOHA_WIKI_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "${KONOHA_WIKI_TOKEN:-}" ]; then
            echo "::notice::KONOHA_WIKI_TOKEN is not configured; Wiki source was validated but publish is skipped."
            echo "::notice::Configure a Wiki-capable token or run scripts/sync-github-wiki.ts --publish from an approved operator session to initialize the Wiki."
            exit 0
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          export GITHUB_TOKEN="$KONOHA_WIKI_TOKEN"
          bun run scripts/sync-github-wiki.ts --publish
