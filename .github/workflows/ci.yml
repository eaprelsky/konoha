name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  portable-preflight:
    name: Portable Preflight
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: konoha
          POSTGRES_PASSWORD: konoha
          POSTGRES_DB: konoha
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U konoha -d konoha"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://konoha:konoha@127.0.0.1:5432/konoha
      KONOHA_TEST_PG_SCHEMA: konoha_test_ci
      KONOHA_TOKEN: konoha-ci-token
      ANTHROPIC_API_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: frontend
      - run: scripts/preflight-portable.sh

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [portable-preflight]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: konoha
          POSTGRES_PASSWORD: konoha
          POSTGRES_DB: konoha
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U konoha -d konoha"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Run E2E tests
        run: bunx playwright test
        env:
          DATABASE_URL: postgres://konoha:konoha@127.0.0.1:5432/konoha
          KONOHA_TOKEN: konoha-dev-token
          ANTHROPIC_API_KEY: ci-placeholder
