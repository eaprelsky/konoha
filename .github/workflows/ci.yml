name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run typecheck

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
        working-directory: frontend
      - run: bun run test
        working-directory: frontend

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
        working-directory: frontend
      - run: bun run build
        working-directory: frontend

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [frontend-build]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bunx playwright install --with-deps chromium
      - name: Start server
        run: |
          KONOHA_PORT=3202 KONOHA_TOKEN=konoha-dev-token bun run start &
          sleep 5
        env:
          KONOHA_TOKEN: konoha-dev-token
          ANTHROPIC_API_KEY: ci-placeholder
      - name: Run E2E tests
        run: bunx playwright test
        env:
          KONOHA_TOKEN: konoha-dev-token
          ANTHROPIC_API_KEY: ci-placeholder
