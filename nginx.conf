server {
    listen 80;
    server_name dash.agent.eaprelsky.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name dash.agent.eaprelsky.ru;

    ssl_certificate /etc/letsencrypt/live/dash.agent.eaprelsky.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dash.agent.eaprelsky.ru/privkey.pem;

    root /home/ubuntu/konoha/dist;

    location = / {
        return 302 /ui/index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3200/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization "Bearer 09dc7176cc5ee5025685580e05d273dcd1c946078996e020970c72078332adf3";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Hashed assets (immutable - filenames contain content hash)
    location ~* ^/ui/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html - always revalidate so browsers pick up new chunk filenames after deploy
    location = /ui/index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    location /ui/ {
        try_files $uri $uri/ /ui/index.html;
    }
}
