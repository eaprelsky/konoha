[Service]
EnvironmentFile=/home/ubuntu/.agent-env
UnsetEnvironment=http_proxy https_proxy HTTP_PROXY HTTPS_PROXY
Environment=TELEGRAM_ROUTER_ENABLED=1
Environment=TELEGRAM_ROUTER_MODEL=google/gemini-2.0-flash-lite-001
